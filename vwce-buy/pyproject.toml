[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vwce-buy"
version = "0.2.0"
description = "Restricted VWCE paper/live order-entry utility for IBKR TWS"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2"]

[project.scripts]
vwce-buy = "vwce_buy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: opt-in PAPER TWS integration test"]

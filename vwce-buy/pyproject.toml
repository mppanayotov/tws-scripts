[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vwce-buy"
version = "0.1.0"
description = "Restricted VWCE paper/live order-entry utility for IBKR TWS"
requires-python = ">=3.11"
dependencies = ["ibapi==9.81.1.post1"]

[project.scripts]
vwce-buy = "vwce_buy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: Unit tests

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
        working-directory: vwce-buy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install official IBKR API 10.49.2
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'twsapi.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'twsapi'
          Invoke-WebRequest 'https://interactivebrokers.github.io/downloads/twsapi_macunix.1049.02.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          python -m pip install (Join-Path $destination 'IBJts/source/pythonclient')
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install .
      - run: python -B -m pytest --ignore=tests/integration
  version-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < vwce-buy/VERSION)" && test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"$/\1/p' vwce-buy/pyproject.toml)"
